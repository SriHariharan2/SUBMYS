spring.application.name=backend

# =====================================================
# POSTGRESQL - NEON
# =====================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Keep false in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Prevent database queries during view rendering
spring.jpa.open-in-view=false


# =====================================================
# SERVER
# =====================================================

server.port=${PORT:10000}

# Request timeout
server.tomcat.connection-timeout=20s


# =====================================================
# HIKARI DATABASE CONNECTION POOL
# =====================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Don't wait 60 seconds for a database connection
spring.datasource.hikari.connection-timeout=10000

spring.datasource.hikari.validation-timeout=5000

spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000


# =====================================================
# CLOUDINARY
# =====================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# =====================================================
# FILE UPLOAD
# =====================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =====================================================
# GMAIL SMTP
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# IMPORTANT:
# Prevent Gmail connection from hanging for 90+ seconds

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Don't test Gmail while application is starting
spring.mail.test-connection=false


# =====================================================
# GEMINI
# =====================================================

GEMINI_API_KEY=${GEMINI_API_KEY}